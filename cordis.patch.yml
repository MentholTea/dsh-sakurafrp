# dsh-sakurafrp 挂载声明。
# id 必须与其它插件行全局不冲突；name 解析到包入口 index.js。
# config 键见 README：所有键都可用，state.json 里的用户设置优先于这里的默认值。
# 注意：config 里出现的路径只是示例。装好后首次启动前，请按 README 填写
# 你自己的 frpc 路径、访问密钥文件与隧道 ID（或全部留空，用设置页配置）。
- insert:
    - id: natfrp
      name: 'dsh-sakurafrp'
      inject:
        - credentials
        - webServer
        - timer
        - connection
      config:
        # ⚠️ 不要在这里写 enabled / gatePort / tunnelId 的默认值：
        #    这个文件是「装上即生效」的初始配置，写了等于替用户做了选择。
        #    装上必须是关的、端口必须是空的、隧道必须由用户自己选。
        # enabled: true   # ← 千万不要打开：等于新装就把 DSH 挂到公网
        # frpcPath: ''    # 留空 = 默认 ~/.dsh/dsh-sakurafrp/frpc-standalone(.exe)
        # tokenFile: ''   # 留空 = 走 DSH credentials 的 tokenRef
        tokenRef: 'NATFRP_TOKEN'
        # tunnelId: ''    # 留空 = 首启后在设置页选择
        # gatePort: 3083  # 留空 = 首次在设置页填；预填会让用户跳过端口检查
        # gateHost: '127.0.0.1'  # 网关监听地址；frpc 同机时无需对外监听，勿改 0.0.0.0
        autoAlign: true
        maxLogLines: 500
